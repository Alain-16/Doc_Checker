[project]
name = "doc-checker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alain-16", email = "mugishalain81@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.106",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.142.2",
    "langchain-openai>=1.6.7",
    "langfuse>=4.16.0",
    "langgraph>=1.2.12",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "sentry-sdk>=2.71.0",
    "sqlalchemy>=2.1.1",
    "tiktoken>=0.14.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package= false

